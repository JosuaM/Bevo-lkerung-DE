<!doctype html><html lang="de"><meta charset="utf-8"><title>Bildexport-Prüfung</title><style>body{font:16px Segoe UI,sans-serif;background:#f5f2e8}iframe{width:1265px;height:780px;border:0}img{max-width:700px}</style><p id="receipt">Exportprüfung wartet.</p><iframe title="Datenpräsentation" src="../website/index.html"></iframe><img id="proof" alt="Exportierte Gesamtgrafik"><script>
document.querySelector('iframe').addEventListener('load',()=>{document.querySelector('iframe').contentWindow.addEventListener('genug-export',async event=>{if(event.detail.type!=='png')return;const blob=event.detail.blob;document.getElementById('proof').src=URL.createObjectURL(blob);const response=await fetch('/qa/save-image',{method:'POST',headers:{'Content-Type':'image/png'},body:blob});document.getElementById('receipt').textContent=await response.text();});});
</script></html>
