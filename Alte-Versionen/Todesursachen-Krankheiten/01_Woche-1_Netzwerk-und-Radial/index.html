function niceStep(max) {
  const raw = max / 6, p = Math.pow(10, Math.floor(Math.log10(raw)));
  return [1, 2, 5, 10].map(f => f * p).find(v => v >= raw);
}

function prepare() {
  const d = DATASETS[key];
  years = d.years;
  series = d.causes.map((c, k) => ({name: c.name, values: c.values, color: COLORS[k % COLORS.length]}));
  // feste Top-N für das Kreisdiagramm: größte Ursachen über alle Jahre
  const sum = c => c.values.reduce((x, y) => x + y, 0);
  topPie = series.map((c, k) => k).sort((a, b) => sum(series[b]) - sum(series[a])).slice(0, TOP_N).sort((a, b) => a - b);
  totals = years.map((_, i) => series.reduce((s, c) => s + c.values[i], 0));
  pop = years.map(yr => POP[key][yr] || null);
}

// Wert eines Segments in der gewählten Ansicht
function val(v, i, view) {
  if (view === "share") return v / totals[i] * 100;
  if (view === "pop") return v / pop[i] * 100;
  return v;
}

const opac = k => (1 - .88 * k / Math.max(1, series.length - 1)).toFixed(2);

function meta(mode) {
  const n = years.length;
  document.getElementById("legend").innerHTML = series.map((c, k) => mode === "stream" ?
    `<div><i style="background:${STREAM_COLOR};opacity:${opac(k)}"></i>${c.name}</div>` :
    `<div data-k="${k}"><i style="background:${c.color}"></i>${c.name}</div>`).join("") +
    (mode === "radialbars" ? `<p class="note">Jeder Sektor ist eine Todesursache, der Balken folgt dem gewählten Jahr (Radius = % der Bevölkerung, Wurzelskala). Der blasse Schatten reicht bis zum Höchststand über alle Jahre, die helle Linie markiert den Peak. Innen: Gesamtrate pro Jahr.</p>` :
    mode === "radial" ? `<p class="note">Radial: Liniendiagramm um den Kreis gebogen (1980 links, im Uhrzeigersinn). Radius = Todesfälle in % der Bevölkerung (Wurzelskala), innen die Gesamtrate pro Jahr. Über Linie oder Legende hovern zeigt den Namen, Klick wählt das Jahr.</p>` :
    mode === "pie" || mode === "race" ? `<p class="note">Animierte Ansichten zeigen nur die Top ${TOP_N}${mode === "pie" ? " (über alle Jahre)" : " des jeweiligen Jahres"}.</p>` : "");
  const region = key === "de" ? "in Deutschland" : "weltweit";
  const t = `Todesfälle ${region} nach Todesursache, ${years[0]}–${years[n - 1]}`;
  document.getElementById("title").textContent = t;
  document.title = t;
}

function render() {
  if (selMode.value === "network") {            // eigene Seite, nur Deutschland
    stopAnim(); unpin(); controls.style.display = "none";
    selData.value = "de"; key = "de"; selData.disabled = true;
    NET.show(); return;
  }
  NET.hide(); selData.disabled = false;
  prepare();
  unpin();
  const view = "pop", n = years.length;
  const vals = series.map(c => c.values.map((v, i) => val(v, i, view)));
  const mode = selMode.value;
  stopAnim();
  if (mode === "pie" || mode === "race" || mode === "radial" || mode === "radialbars") { startAnim(mode); meta(mode); return; }
  controls.style.display = "none";
  const x = i => M.l + (i + .5) * iw / n;
  const bump = pts => pts.map(([px, py], j) => {
    if (!j) return `M${px},${py}`;
    const mx = (pts[j - 1][0] + px) / 2;
    return `C${mx},${pts[j - 1][1]} ${mx},${py} ${px},${py}`;
  }).join("");
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Diagramm der Todesfälle">`;
  const yearLabels = () => years.map((yr, i) => (yr % 5 === 0 || i === n - 1) ? `<text x="${x(i)}" y="${H - M.b + 18}" text-anchor="middle">${yr}</text>` : "").join("");
  let ylabel;
  if (mode === "line") {
    const dataMax = Math.max(...vals.flat());
    const step = niceStep(dataMax), yMax = Math.ceil(dataMax / step) * step;
    const y = v => M.t + ih - v / yMax * ih;
    const label = v => v.toLocaleString("de-DE", {maximumFractionDigits: 2}) + " %";
    for (let v = 0; v <= yMax + 1e-9; v += step) {
      s += `<line class="grid" x1="${M.l}" x2="${W - M.r}" y1="${y(v)}" y2="${y(v)}"/>`;
      s += `<text x="${M.l - 6}" y="${y(v) + 4}" text-anchor="end">${label(v)}</text>`;
    }
    s += yearLabels();
    series.forEach((c, k) => {
      s += `<polyline fill="none" stroke="${c.color}" stroke-width="2" stroke-linejoin="round" points="${vals[k].map((v, i) => x(i) + "," + y(v)).join(" ")}"/>`;
    });
    series.forEach((c, k) => vals[k].forEach((v, i) => {
      s += `<circle data-i="${i}" data-k="${k}" cx="${x(i)}" cy="${y(v)}" r="4" fill="${c.color}" fill-opacity="0"/>`;
    }));
    ylabel = "Todesfälle in % der Bevölkerung";
  } else {
    // Streamgraph: gestapelt, Grundlinie so verschoben, dass die Summe um die Mitte zentriert ist
    const tot = years.map((_, i) => vals.reduce((a, v) => a + v[i], 0));
    const half = Math.max(...tot) / 2, cy = M.t + ih / 2;
    const y = v => cy - v / half * ih / 2;
    const lo = tot.map(t => -t / 2), acc = lo.slice();
    const layers = series.map((c, k) => {
      const bot = acc.slice(), top = acc.map((a, i) => a + vals[k][i]);
      top.forEach((t, i) => acc[i] = t);
      return {bot, top};
    });
    series.forEach((c, k) => {
      const {bot, top} = layers[k];
      const up = top.map((t, i) => [x(i), y(t)]), down = bot.map((b, i) => [x(i), y(b)]).reverse();
      s += `<path class="st" data-k="${k}" fill="${STREAM_COLOR}" fill-opacity="${opac(k)}" d="${bump(up)}L${down[0][0]},${down[0][1]}${bump(down).replace(/^M[^C]*/, "")}Z"/>`;
    });
    series.forEach((c, k) => {
      const {bot, top} = layers[k];
      let bi = 0;
      top.forEach((t, i) => { if (t - bot[i] > top[bi] - bot[bi]) bi = i; });
      const px = (top[bi] - bot[bi]) / half * ih / 2;
      if (px >= 13) s += `<text class="sl" x="${Math.min(Math.max(x(bi), M.l + 90), W - M.r - 90)}" y="${y((top[bi] + bot[bi]) / 2) + 4}" style="font-size:${Math.min(16, 9 + px / 8)}px">${c.name.length > 28 ? c.name.slice(0, 26) + "…" : c.name}</text>`;
    });
    s += yearLabels();
    const sb = 0.05, sbPx = sb / half * ih / 2 * 2;
    s += `<line x1="${M.l - 20}" x2="${M.l - 20}" y1="${cy - sbPx / 2}" y2="${cy + sbPx / 2}" stroke="#444" stroke-width="2"/>`;
    s += `<text x="${M.l - 26}" y="${cy + 4}" text-anchor="end">${(sb).toLocaleString("de-DE")} %</text>`;
    ylabel = "Todesfälle in % der Bevölkerung (Höhe)";
  }
  s += `<text x="12" y="${M.t + ih / 2}" text-anchor="middle" transform="rotate(-90 12 ${M.t + ih / 2})">${ylabel}</text>`;
  s += `<text x="${M.l + iw / 2}" y="${H - 4}" text-anchor="middle">Jahr</text></svg>`;
  chart.innerHTML = s;

  meta(mode);
}

const rank = vs => { const o = vs.map((v, k) => k).sort((a, b) => vs[b] - vs[a]), r = []; o.forEach((k, p) => r[k] = p); return r; };

function setPlaying(p) { playing = p; playBtn.textContent = p ? "❚❚ Pause" : "▶ Start"; }

function loop(ts) {

  if (playing) {
    tYear += dt * SPEED; need = true;
    if (tYear >= years.length - 1) { tYear = years.length - 1; setPlaying(false); }
  }
  if (animMode === "race" && !settled) need = true;
  if (need) drawAnim(dt);

// Fortschrittsverlauf: Anteil aller Todesfälle an der Bevölkerung pro Jahr als Linie, bis zum aktuellen Jahr hervorgehoben
function drawProg() {
  const n = years.length, rate = totals.map((t, i) => t / pop[i] * 100);

    `<polyline fill="none" stroke="#c9b3d3" stroke-width="2" vector-effect="non-scaling-stroke" points="${pts.map(p => p.join(",")).join(" ")}"/>` +

  const lp = arr => arr[j] + (j < n - 1 ? (arr[j + 1] - arr[j]) * (tt - j) : 0);

  const ip = []; for (let q = 0; q <= j; q++) ip.push(rP(A(q), yOf(rate[q]))); if (tt > j) ip.push(rP(At, yOf(lp(rate))));
  const baseP = ip.map((_, q) => rP(q <= j ? A(q) : At, RR.y0)).reverse().map(p => f1(p[0]) + "," + f1(p[1])).join("L");
  let h = `<path d="${rSmooth(ip)}L${baseP}Z" fill="#f0a35e" fill-opacity=".18"/><path d="${rSmooth(ip)}" fill="none" stroke="#f0a35e" stroke-width="2"/>`;
  series.forEach((c, k) => {
    const dim = hoverK >= 0 && hoverK !== k, rv = rOf(lp(v[k]));
    h += `<path d="${rArc(sA(k) + bw, sA(k) + secW - bw, RR.in, Math.max(RR.in + .5, rv))}" fill="${c.color}" fill-opacity="${dim ? .2 : .95}"${hoverK === k ? ' stroke="#fff" stroke-width="1.2"' : ""}/>`;
  });
  const ie = ip[ip.length - 1];
  h += `<circle cx="${f1(ie[0])}" cy="${f1(ie[1])}" r="4" fill="#f0a35e" stroke="#fff" stroke-width="1.2"/>`;
  const [sx0, sy0] = rP(At, RR.b0), [sx1, sy1] = rP(At, RR.b1);
  h += `<line x1="${f1(sx0)}" y1="${f1(sy0)}" x2="${f1(sx1)}" y2="${f1(sy1)}" stroke="#fff" stroke-width="2"/>`;
  h += `<text x="${RC}" y="${RC + 9}" text-anchor="middle" style="font-size:30px;font-weight:600">${years[i]}</text>` +
    `<text class="dim" x="${RC}" y="${RC + 26}" text-anchor="middle" style="font-size:9.5px">${pct(rate[i], 2)} gestorben</text>` +
    `<text class="dim" x="${RC}" y="${RC - 20}" text-anchor="middle" style="font-size:9px">${fmt(Math.round(totals[i]))}</text>` +
    `<text class="dim" x="${RC}" y="${RC - 10}" text-anchor="middle" style="font-size:8px">Todesfälle</text>`;
  chart.innerHTML = `<svg class="rad" viewBox="0 0 ${RW} ${RW}" style="max-height:calc(100vh - 140px)" role="img" aria-label="Radiale Balken der Todesursachen">${radB.static}${h}</svg>`;
}

// Zeiger -> Jahr, Ursache (nächste Linie)
function radialLocate(e) {
  const r = chart.querySelector("svg").getBoundingClientRect(), sc = RW / r.width, n = years.length;
  const x = (e.clientX - r.left) * sc - RC, y = (e.clientY - r.top) * sc - RC, rr = Math.hypot(x, y);
  const deg = (((Math.atan2(x, -y) * 180 / Math.PI) - RSTART) % 360 + 360) % 360;
  const t = deg / (360 - RGAP) * (n - 1);
  if (deg > 360 - RGAP || rr < RR.y0 - 4) return null;
  const i = Math.round(t);
  if (rr < RR.y1 + 6) return {year: i, total: true};
  if (rr < RR.in - 2) return {year: i, band: true};
  if (animMode === "radialbars") {
    if (!radB || rr > RR.out + 6) return null;
    return {year: i, cause: Math.min(series.length - 1, Math.floor(deg / (360 - RGAP) * series.length)), bar: true};
  }
  if (!rad || rr > RR.out + 6) return null;
  if (t > tYear + .5) return {year: i};
  const i0 = Math.min(n - 2, Math.floor(t)), f = t - i0;
  let best = -1, bd = 14;
  series.forEach((c, k) => { const d = Math.abs(rad.rOf(rad.v[k][i0] * (1 - f) + rad.v[k][i0 + 1] * f) - rr); if (d < bd) { bd = d; best = k; } });
  return {year: i, cause: best};
}
function radialTip(e) {
  const h = radialLocate(e);
  setHover(h && h.cause !== undefined ? h.cause : -1);
  if (!h) { tip.style.display = "none"; return; }
  const i = h.year;
  if (h.bar) {
    const k = h.cause, c = series[k], pk = radB.peak[k], cu = radB.v[k][Math.min(years.length - 1, Math.round(tYear))];
    tip.innerHTML = `<b style="color:${c.color}">${k + 1} · ${c.name}</b><br>${years[Math.round(tYear)]}: ${pct(cu, 4)} der Bevölkerung<br>Peak: ${pct(radB.v[k][pk], 4)} im Jahr ${years[pk]}`;
    tip.style.display = "block";
    tip.style.left = Math.max(0, Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8)) + "px";
    tip.style.top = Math.max(0, Math.min(e.clientY + 14, innerHeight - tip.offsetHeight - 8)) + "px";
    return;
  }
  const html = h.cause >= 0 ? tipHtml(i, h.cause) : h.cause === undefined ?
    `<b>${years[i]}</b>${h.total ? " · alle Ursachen" : ""}<br>${fmt(Math.round(totals[i]))} Todesfälle<br>${pct(totals[i] / pop[i] * 100, 3)} der Bevölkerung (${fmt(pop[i])})` : `<b>${years[i]}</b>`;
  tip.innerHTML = html; tip.style.display = "block";
  tip.style.left = Math.max(0, Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8)) + "px";
  tip.style.top = Math.max(0, Math.min(e.clientY + 14, innerHeight - tip.offsetHeight - 8)) + "px";
}
document.getElementById("legend").addEventListener("mouseover", e => { if (!isRad()) return; const d = e.target.closest("div[data-k]"); setHover(d ? +d.dataset.k : -1); });
document.getElementById("legend").addEventListener("mouseleave", () => { if (isRad()) setHover(-1); });

selMode.addEventListener("change", render);
selData.addEventListener("change", () => { key = selData.value; render(); });
key = selData.value;
render();
</script>
</body>
