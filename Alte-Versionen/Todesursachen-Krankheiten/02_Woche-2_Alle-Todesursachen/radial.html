const POP = {"global": {"1980": 4437473406, "1981": 4516792587, "1982": 4599385851, "1983": 4682734714, "1984": 4765813206, "1985": 4850494238, "1986": 4937459951, "1987": 5026770385, "1988": 5116898810, "1989": 5207378374, "1990": 5298962018, "1991": 5388203305, "1992": 5476822930, "1993": 5564459142, "1994": 5650534421, "1995": 5736205135, "1996": 5822327903, "1997": 5908180322, "1998": 5993730786, "1999": 6078069822, "2000": 6161528496, "2001": 6244739668, "2002": 6327171255, "2003": 6409352386, "2004": 6492354627, "2005": 6575410029, "2006": 6659536021, "2007": 6744049498, "2008": 6830080867, "2009": 6916168196, "2010": 7000860073, "2011": 7086704141, "2012": 7176482165, "2013": 7265404737, "2014": 7353532223, "2015": 7441084771, "2016": 7528221579, "2017": 7613788655, "2018": 7696159728, "2019": 7777162476, "2020": 7853863139, "2021": 7919567995, "2022": 7988550201, "2023": 8062923417}, "de": {"1980": 78288576, "1981": 78407907, "1982": 78333366, "1983": 78128282, "1984": 77858685, "1985": 77684873, "1986": 77720436, "1987": 77839920, "1988": 78144619, "1989": 78751283, "1990": 79433029, "1991": 80013896, "1992": 80624598, "1993": 81156363, "1994": 81438348, "1995": 81678051, "1996": 81914831, "1997": 82034771, "1998": 82047195, "1999": 82100243, "2000": 82211508, "2001": 82349925, "2002": 82488495, "2003": 82534176, "2004": 82516260, "2005": 82469422, "2006": 82376451, "2007": 82266372, "2008": 82110097, "2009": 81902307, "2010": 81776930, "2011": 80274983, "2012": 80425823, "2013": 80645605, "2014": 80982500, "2015": 81686611, "2016": 82348669, "2017": 82657002, "2018": 82905782, "2019": 83092962, "2020": 83160871, "2021": 83196078, "2022": 83177813, "2023": 83287273}};
const COLORS = ["#ff6b5e","#ff9f43","#feca57","#5fd68a","#2ec4b6","#54a0ff","#a78bfa","#f08a4b","#9fb1c4","#ff7eb6",
  "#1dd1a1","#48dbfb","#8c7ae6","#fbc531","#c8d6e5","#c4b5fd","#7bed9f","#ffb8a1","#a4b0be","#ff8f6b","#74b9ff"];
const W = 1160, C = W / 2, GAP = 14, SEC_PAD = 1.2;
const R = {c:62, y0:72, y1:134, lab:150, band0:166, band1:182, in:200, out:400};
const sel = id => document.getElementById(id);
const tip = sel("tip"), chart = sel("chart"), slider = sel("yr"), play = sel("play");
const fmt = v => v.toLocaleString("de-DE");
const pc = (v, d = 3) => v.toLocaleString("de-DE", {minimumFractionDigits:d, maximumFractionDigits:d}) + " %";
let key, years, series, pop, totals, rate, vmax, tickVals, cur = 0, geo = {}, timer = 0;

const rad = d => d * Math.PI / 180;
const P = (th, r) => [C + r * Math.sin(rad(th)), C - r * Math.cos(rad(th))];
const f1 = n => n.toFixed(1);
function arc(a0, a1, r0, r1) {
  const [x0,y0] = P(a0,r1), [x1,y1] = P(a1,r1), [x2,y2] = P(a1,r0), [x3,y3] = P(a0,r0), big = a1 - a0 > 180 ? 1 : 0;
  return `M${f1(x0)},${f1(y0)}A${r1},${r1} 0 ${big} 1 ${f1(x1)},${f1(y1)}L${f1(x2)},${f1(y2)}A${r0},${r0} 0 ${big} 0 ${f1(x3)},${f1(y3)}Z`;
}
function ring(r) { return `<circle cx="${C}" cy="${C}" r="${r}" fill="none" />`; }

function prepare() {
  const d = DATASETS[key];
  years = d.years;
  pop = years.map(y => POP[key][y]);
  series = d.causes.map((c, k) => ({name:c.name, color:COLORS[k % COLORS.length], v:c.values.map((x, i) => x / pop[i] * 100), n:c.values}));
  totals = years.map((_, i) => series.reduce((s, c) => s + c.n[i], 0));
  rate = totals.map((t, i) => t / pop[i] * 100);
  const mx = Math.max(...series.flatMap(c => c.v));
  const cand = [.001,.002,.005,.01,.02,.05,.1,.2,.25,.3,.4,.5,.6,.8,1,2];
  vmax = cand.find(v => v >= mx);
  const base = cand.filter(v => v <= vmax);
  tickVals = sel("scale").value === "sqrt" ? base.filter(v => [.01,.05,.1,.2,.3,.5,1,2].includes(v)) : base.filter(v => [1,2,5].includes(+(v / Math.pow(10, Math.floor(Math.log10(v)))).toFixed(1)) && v >= vmax / 8);
  if (!tickVals.length) tickVals = base;
  slider.max = years.length - 1;
}
const rOf = v => R.in + (sel("scale").value === "sqrt" ? Math.sqrt(v / vmax) : v / vmax) * (R.out - R.in);

function build() {
  const n = years.length, N = series.length, secW = (360 - GAP) / N;
  const sec0 = k => GAP / 2 + k * secW;            // Start, 0° = oben, im Uhrzeigersinn; Lücke liegt bei 0° (oben)
  // Lücke nach links drehen: Winkel um 90° verschieben
  const rot = 270;
  const th = a => a + rot;
  const yA = (i, j) => th(sec0(0)) + 0;           // Platzhalter, nicht benutzt
  geo = {secW, rot, sec0, N, n};
  const yearAngle = i => 360 / n * (i + .5);       // Jahresring: volle 360°
  const ang = (k, i) => th(sec0(k) + SEC_PAD / 2 + (i + .5) * (secW - SEC_PAD) / n);
  geo.ang = ang; geo.yearAngle = yearAngle;
  let s = `<svg viewBox="0 0 ${W} ${W}" role="img" aria-label="Radiales Diagramm der Todesursachen">`;
  // --- Raster
  s += `<g stroke="#3a3f73" stroke-width=".7" fill="none">`;
  tickVals.forEach(v => s += `<circle cx="${C}" cy="${C}" r="${f1(rOf(v))}" stroke-dasharray="2 4" />`);
  s += `<circle cx="${C}" cy="${C}" r="${R.in}" /><circle cx="${C}" cy="${C}" r="${R.out}" />`;
  s += `<circle cx="${C}" cy="${C}" r="${R.y0}" /><circle cx="${C}" cy="${C}" r="${R.y1}" stroke-dasharray="1 3" />`;
  s += `<circle cx="${C}" cy="${C}" r="${R.band1 + 6}" />`;
  // Sektor-Trenner
  for (let k = 0; k <= N; k++) { const a = th(sec0(k)); const [x0,y0] = P(a, R.band0), [x1,y1] = P(a, R.out); s += `<line x1="${f1(x0)}" y1="${f1(y0)}" x2="${f1(x1)}" y2="${f1(y1)}" stroke-opacity=".55" />`; }
  s += `</g>`;
  // --- Jahresring (Gesamtrate pro Jahr)
  const rmax = Math.max(...rate);
  const yr = v => R.y0 + v / rmax * (R.y1 - R.y0);
  s += `<g id="ybars">`;
  rate.forEach((v, i) => {
    const a0 = 360 / n * i + .25, a1 = 360 / n * (i + 1) - .25;
    s += `<path data-y="${i}" class="yb" d="${arc(a0, a1, R.y0, yr(v))}" fill="#f0a35e" fill-opacity=".55" />`;
  });
  s += `</g>`;
  [0.5, 1].map(f => f * rmax).forEach(() => {});
  // Jahresmarken (alle 5 Jahre) zwischen Jahresring und Bändern
  years.forEach((y, i) => {
    const a = yearAngle(i), maj = y % 10 === 0, mid = y % 5 === 0;
    const [x0,y0] = P(a, R.y1 + 2), [x1,y1] = P(a, R.y1 + (maj ? 11 : mid ? 7 : 4));
    s += `<line x1="${f1(x0)}" y1="${f1(y0)}" x2="${f1(x1)}" y2="${f1(y1)}" stroke="#8b8fb8" stroke-width="${maj ? 1.2 : .7}" />`;
    if (mid) { const [tx,ty] = P(a, R.lab + 6); s += `<text class="dim" x="${f1(tx)}" y="${f1(ty + 3)}" text-anchor="middle" style="font-size:${maj ? 9.5 : 8}px">${y}</text>`; }
  });
  // --- Ursachen-Band
  series.forEach((c, k) => {
    const a0 = th(sec0(k)) + SEC_PAD / 2, a1 = th(sec0(k) + secW) - SEC_PAD / 2;
    s += `<path d="${arc(a0, a1, R.band0, R.band1)}" fill="${c.color}" fill-opacity=".85" />`;
    const [tx, ty] = P((a0 + a1) / 2, (R.band0 + R.band1) / 2);
    s += `<text x="${f1(tx)}" y="${f1(ty + 3.5)}" text-anchor="middle" style="font-size:10px;font-weight:700;fill:#14172e">${k + 1}</text>`;
    // Jahresticks am inneren Rand der Linienzone (alle 10 Jahre)
    years.forEach((y, i) => { if (y % 10 === 0) { const a = ang(k, i), [x0,y0] = P(a, R.band1 + 1), [x1,y1] = P(a, R.in - 2); s += `<line x1="${f1(x0)}" y1="${f1(y0)}" x2="${f1(x1)}" y2="${f1(y1)}" stroke="${c.color}" stroke-opacity=".35" stroke-width=".7" stroke-dasharray="1 2" />`; } });
    // Name außen
    const m = (a0 + a1) / 2, norm = ((m % 360) + 360) % 360, left = norm > 180;
    const [px, py] = P(m, R.out + 8);
    const nm = (k + 1) + " " + (c.name.length > 30 ? c.name.slice(0, 28) + "…" : c.name);
    s += `<text x="${f1(px)}" y="${f1(py)}" dy="3" text-anchor="${left ? "end" : "start"}" transform="rotate(${f1(left ? m + 90 : m - 90)} ${f1(px)} ${f1(py)})" style="font-size:10px;fill:${c.color}">${nm}</text>`;
  });
  // --- Linien (Lollipops) je Ursache und Jahr
  s += `<g id="lolli">`;
  series.forEach((c, k) => {
    s += `<g stroke="${c.color}" fill="${c.color}">`;
    c.v.forEach((v, i) => {
      const a = ang(k, i), r1 = rOf(v), [x0,y0] = P(a, R.in), [x1,y1] = P(a, r1);
      s += `<line x1="${f1(x0)}" y1="${f1(y0)}" x2="${f1(x1)}" y2="${f1(y1)}" stroke-width=".45" stroke-opacity=".6" /><circle cx="${f1(x1)}" cy="${f1(y1)}" r="1.4" stroke="none" />`;
    });
    s += `</g>`;
  });
  s += `</g><g id="hl"></g>`;
  // --- Skalenbeschriftung in der Lücke (links)
  const gx = C;
  tickVals.forEach(v => { const r = rOf(v); s += `<text class="halo dim" x="${f1(gx - r)}" y="${C + 3}" text-anchor="middle" style="font-size:9.5px">${v.toLocaleString("de-DE")} %</text>`; });
  s += `<text class="dim" x="${C - R.in - 2}" y="${C - 8}" text-anchor="middle" style="font-size:8.5px">% der Bevölkerung</text>`;
  s += `<text class="dim" x="${C}" y="${C - R.y1 - 14}" text-anchor="middle" style="font-size:8px;opacity:0">.</text>`;
  s += `<g id="ctr"></g></svg>`;
  chart.innerHTML = s;
  mark();
}

function mark() {
  const i = cur, n = years.length, N = series.length;
  let h = "";
  const a = geo.yearAngle(i);
  h += `<path d="${arc(360 / n * i, 360 / n * (i + 1), R.y0, R.y1)}" fill="#fff" fill-opacity=".14" />`;
  series.forEach((c, k) => {
    const ak = geo.ang(k, i), r1 = rOf(c.v[i]), [x0,y0] = P(ak, R.in), [x1,y1] = P(ak, r1), [x2,y2] = P(ak, R.out);
    h += `<line x1="${f1(x0)}" y1="${f1(y0)}" x2="${f1(x2)}" y2="${f1(y2)}" stroke="#fff" stroke-opacity=".12" stroke-width=".6" />`;
    h += `<line x1="${f1(x0)}" y1="${f1(y0)}" x2="${f1(x1)}" y2="${f1(y1)}" stroke="#fff" stroke-width="1.8" /><circle cx="${f1(x1)}" cy="${f1(y1)}" r="3.4" fill="${c.color}" stroke="#fff" stroke-width="1.2" />`;
  });
  sel("hl").innerHTML = h;
  sel("ctr").innerHTML = `<text x="${C}" y="${C + 9}" text-anchor="middle" style="font-size:30px;font-weight:600">${years[i]}</text>` +
    `<text class="dim" x="${C}" y="${C + 26}" text-anchor="middle" style="font-size:9.5px">${pc(rate[i], 2)} gestorben</text>` +
    `<text class="dim" x="${C}" y="${C - 20}" text-anchor="middle" style="font-size:9px">${fmt(Math.round(totals[i]))}</text>` +
    `<text class="dim" x="${C}" y="${C - 10}" text-anchor="middle" style="font-size:8px">Todesfälle</text>`;
  slider.value = i; sel("yl").textContent = years[i];
}

function setYear(i) { cur = Math.max(0, Math.min(years.length - 1, i)); mark(); }
function stop() { clearInterval(timer); timer = 0; play.textContent = "▶ Start"; }
play.onclick = () => {
  if (timer) return stop();
  if (cur >= years.length - 1) setYear(0);
  play.textContent = "❚❚ Pause";
  timer = setInterval(() => { if (cur >= years.length - 1) return stop(); setYear(cur + 1); }, 350);
};
slider.oninput = () => { stop(); setYear(+slider.value); };

// Treffererkennung per Polarkoordinaten
function locate(e) {
  const svg = chart.querySelector("svg"), r = svg.getBoundingClientRect(), sc = W / r.width;
  const x = (e.clientX - r.left) * sc - C, y = (e.clientY - r.top) * sc - C, rr = Math.hypot(x, y);
  const t = ((Math.atan2(x, -y) * 180 / Math.PI) % 360 + 360) % 360, n = years.length;
  if (rr >= R.y0 && rr <= R.y1 + 12) return {year: Math.min(n - 1, Math.floor(t / 360 * n))};
  if (rr >= R.band0 && rr <= R.out + 4) {
    const u = (((t - geo.rot) % 360) + 360) % 360 - 0; // relativ zum Start der ersten Sektoren
    const rel = u - GAP / 2;
    if (rel < 0 || rel >= 360 - GAP) return null;
    const k = Math.floor(rel / geo.secW), inner = rel - k * geo.secW - SEC_PAD / 2;
    const i = Math.floor(inner / ((geo.secW - SEC_PAD) / n));
    if (i < 0 || i >= n) return {cause: k};
    return {cause: k, year: i, line: rr >= R.in};
  }
  return null;
}
chart.addEventListener("mousemove", e => {
  const h = locate(e);
  if (!h || (h.year === undefined && h.cause === undefined)) { tip.style.display = "none"; return; }
  let html;
  if (h.cause === undefined) html = `<b>${years[h.year]}</b> · alle Ursachen<br>${fmt(Math.round(totals[h.year]))} Todesfälle<br>${pc(rate[h.year])} der Bevölkerung (${fmt(pop[h.year])})`;
  else {
    const c = series[h.cause];
    html = `<b style="color:${c.color}">${h.cause + 1} · ${c.name}</b>`;
    if (h.year !== undefined && h.line !== false) html += `<br><b>${years[h.year]}</b>: ${fmt(c.n[h.year])} Todesfälle<br>${pc(c.v[h.year], 4)} der Bevölkerung<br>${pc(c.n[h.year] / totals[h.year] * 100, 1)} aller Todesfälle`;
  }
  tip.innerHTML = html; tip.style.display = "block";
  tip.style.left = Math.max(0, Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8)) + "px";
  tip.style.top = Math.max(0, Math.min(e.clientY + 14, innerHeight - tip.offsetHeight - 8)) + "px";
});
chart.addEventListener("mouseleave", () => tip.style.display = "none");
chart.addEventListener("click", e => { const h = locate(e); if (h && h.year !== undefined) { stop(); setYear(h.year); } });

function render() {
  key = sel("dataset").value; stop(); prepare();
  const t = `Todesfälle ${key === "de" ? "in Deutschland" : "weltweit"} nach Todesursache, ${years[0]}–${years[years.length - 1]}`;
  sel("title").textContent = t; document.title = t;
  cur = Math.min(cur, years.length - 1);
  build();
}
sel("dataset").onchange = render; sel("scale").onchange = render;
render();
</script>
