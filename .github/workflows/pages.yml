# Veröffentlicht die Webseite aus Bevoelkerung-DE bei jedem Push auf main über GitHub Pages.
# Einmalig einstellen: Repository → Settings → Pages → Build and deployment → Source: „GitHub Actions“.
name: Webseite veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Dateien der Webseite zusammenstellen
        run: |
          mkdir _site
          cp -r Bevoelkerung-DE/index.html Bevoelkerung-DE/jeremy.html Bevoelkerung-DE/css Bevoelkerung-DE/js Bevoelkerung-DE/dashboards _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
